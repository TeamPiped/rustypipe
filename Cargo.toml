[package]
name = "rustypipe"
version = "0.1.0"
edition = "2021"
authors = ["ThetaDev"]
license = "GPL-3.0"
description = "Client for the public YouTube / YouTube Music API (Innertube), inspired by NewPipe"
keywords = ["youtube", "video", "music"]

include = ["/src", "README.md", "LICENSE", "!snapshots"]

[workspace]
members = [".", "codegen", "cli"]

[features]
default = ["default-tls"]

html = ["askama_escape"]

# Reqwest TLS
default-tls = ["reqwest/default-tls"]
rustls-tls-webpki-roots = ["reqwest/rustls-tls-webpki-roots"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]

[dependencies]
# quick-js = "0.4.1"
quick-js = { path = "../quickjs-rs" }
once_cell = "1.12.0"
fancy-regex = "0.10.0"
anyhow = "1.0"
url = "2.2.2"
log = "0.4.17"
reqwest = {version = "0.11.11", default-features = false, features = ["json", "gzip", "brotli", "stream"]}
tokio = {version = "1.20.0", features = ["macros", "time", "fs", "process"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.82"
serde_with = {version = "2.0.0", features = ["json"] }
rand = "0.8.5"
chrono = {version = "0.4.19", features = ["serde"]}
chronoutil = "0.2.3"
futures = "0.3.21"
indicatif = "0.17.0"
filenamify = "0.1.0"
ress = "0.11.4"
phf  = "0.11.1"
askama_escape = {version = "0.10.3", optional = true}

[dev-dependencies]
env_logger = "0.9.0"
test-log = "0.2.11"
rstest = "0.15.0"
temp_testdir = "0.2.3"
insta = {version = "1.17.1", features = ["yaml", "redactions"]}
velcro = "0.5.3"
