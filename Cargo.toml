[package]
authors.workspace = true
categories.workspace = true
description = "Client for the public YouTube / YouTube Music API (Innertube), inspired by NewPipe"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "rustypipe"
repository.workspace = true
version = "0.11.4"

include = ["/src", "README.md", "CHANGELOG.md", "LICENSE", "!snapshots"]

[workspace]
members = [".", "codegen", "downloader", "cli"]

[workspace.package]
authors = ["ThetaDev <thetadev@magenta.de>"]
categories = ["api-bindings", "multimedia"]
edition = "2021"
keywords = ["youtube", "video", "music"]
license = "GPL-3.0"
repository = "https://codeberg.org/ThetaDev/rustypipe"

[workspace.dependencies]
data-encoding = "2.0.0"
fancy-regex = "0.18.0"
flexon = {version = "0.4.6", default-features = false, features = ["simd", "runtime-detection", "serde"]}
futures-util = "0.3.31"
localzone = "0.3.1"
once_cell = "1.12.0"
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_parser = "0.149.0"
oxc_span = "0.133.0"
phf = "0.13.1"
phf_codegen = "0.13.1"
quick-xml = {version = "0.40.1", features = ["serialize"]}
rand = "0.10.1"
regex = "1.6.0"
ress = "0.11.0"
rquickjs = "0.12.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0.82"
serde_plain = "1.0.0"
serde_with = {version = "3.0.0", default-features = false, features = [
  "alloc",
  "macros",
]}
sha1 = "0.11.0"
thiserror = "2.0.0"
time = {version = "0.3.37", features = [
  "macros",
  "serde-human-readable",
  "serde-well-known",
  "local-offset",
]}
tokio = "1.20.4"
tracing = {version = "0.1.0", features = ["log"]}
url = "2.2.0"
urlencoding = "2.1.0"
wreq = {version = "5.3.0", default-features = false}
wreq-util = "2.2.6"

# CLI
anyhow = "1.0"
clap = {version = "4.6.1", features = ["derive"]}
dirs = "6.0.0"
filenamify = "0.1.0"
indicatif = "0.18.4"
serde_yaml = "0.9.0"
tracing-subscriber = {version = "0.3.17", features = ["env-filter"]}

# Testing
insta = {version = "1.17.1", features = ["ron", "redactions"]}
path_macro = "1.0.0"
rstest = "0.26.1"
tokio-test = "0.4.2"
tracing-test = "0.2.5"

# Included crates
rustypipe = {path = ".", version = "0.11.4", default-features = false}
rustypipe-downloader = {path = "./downloader", version = "0.3.1", default-features = false, features = [
  "indicatif",
  "audiotag",
]}

[features]
default = ["default-tls"]

rss = ["dep:quick-xml"]
userdata = []

# wreq TLS options
default-tls = ["wreq/webpki-roots"]
native-tls = ["default-tls"]
native-tls-alpn = ["default-tls"]
native-tls-vendored = ["default-tls"]
rustls-tls-native-roots = ["wreq/native-roots"]
rustls-tls-webpki-roots = ["wreq/webpki-roots"]

[dependencies]
data-encoding.workspace = true
fancy-regex.workspace = true
flexon.workspace = true
localzone.workspace = true
once_cell.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
phf.workspace = true
quick-xml = {workspace = true, optional = true}
rand.workspace = true
regex.workspace = true
ress.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_plain.workspace = true
serde_with.workspace = true
sha1.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = {workspace = true, features = ["macros", "time", "process"]}
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
wreq = {workspace = true, features = ["json", "gzip", "brotli", "socks"]}

[dev-dependencies]
insta.workspace = true
path_macro.workspace = true
rstest.workspace = true
tokio-test.workspace = true
tracing-test.workspace = true

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --features rss,userdata --no-deps --open
features = ["rss", "userdata"]
rustdoc-args = ["--cfg", "docsrs"]
