[package]
name = "rusty-tube"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quick-js = "0.4.1"
once_cell = "1.12.0"
fancy-regex = "0.10.0"
anyhow = "1.0"
thiserror = "1.0.31"
url = "2.2.2"
log = "0.4.17"
reqwest = "0.11.11"
tokio = {version = "1.20.0", features = ["macros"]}
serde_json = "1.0.82"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8.5"

[dev-dependencies]
env_logger = "0.9.0"
test-log = "0.2.11"
