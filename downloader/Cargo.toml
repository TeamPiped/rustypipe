[package]
name = "rustypipe-downloader"
version = "0.3.1"
rust-version = "1.67.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Downloader extension for RustyPipe"

[features]
default = ["default-tls"]

# wreq TLS options
default-tls = ["wreq/webpki-roots", "rustypipe/default-tls"]
native-tls = ["default-tls", "rustypipe/native-tls"]
native-tls-alpn = ["default-tls", "rustypipe/native-tls-alpn"]
native-tls-vendored = ["default-tls", "rustypipe/native-tls-vendored"]
rustls-tls-webpki-roots = [
    "wreq/webpki-roots",
    "rustypipe/rustls-tls-webpki-roots",
]
rustls-tls-native-roots = [
    "wreq/native-roots",
    "rustypipe/rustls-tls-native-roots",
]

audiotag = ["dep:lofty", "dep:image", "dep:smartcrop2"]

# SABR attestation refresh prefers the chromey (real-browser)
# PoToken provider over the botguard binary. The chromey path
# uses botguard's `asyncSnapshotFunction` bound to a real
# `(visitor_data, deobf.sts)` pair, which is what GVS expects
# for a valid attestation refresh — see
# `mint_attestation_po_token` and the chromey provider.
chromey-po-token = []

[dependencies]
rustypipe.workspace = true
sabr = { path = "../sabr" }
once_cell.workspace = true
regex.workspace = true
thiserror.workspace = true
futures-util.workspace = true
wreq = { workspace = true, features = ["stream"] }
rand.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "process"] }
url = "2"
indicatif = { workspace = true, optional = true }
filenamify.workspace = true
tracing.workspace = true
time.workspace = true
data-encoding.workspace = true
lofty = { version = "0.22.0", optional = true }
image = { version = "0.25.0", optional = true, default-features = false, features = [
    "rayon",
    "jpeg",
    "webp",
] }
smartcrop2 = { version = "0.4.0", optional = true }

[dev-dependencies]
flexon.workspace = true
path_macro.workspace = true
rstest.workspace = true
temp_testdir = "0.2.3"

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --features indicatif,audiotag --no-deps --open
features = ["indicatif", "audiotag"]
rustdoc-args = ["--cfg", "docsrs"]
