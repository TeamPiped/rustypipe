[package]
name = "rustypipe-derive"
version = "0.1.0"
rust-version = "1.74.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Procedural macros for rustypipe"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
