[package]
name = "rustypipe-cli"
version = "0.7.2"
rust-version = "1.70.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for RustyPipe - download videos and extract data from YouTube / YouTube Music"

[features]
default = ["native-tls"]
timezone = ["dep:time", "dep:time-tz"]
chromey-po-token = [
    "rustypipe/chromey-po-token",
    "rustypipe-downloader/chromey-po-token",
    "dep:chromey",
]

# wreq TLS options
native-tls = [
    "rustypipe/native-tls",
    "rustypipe-downloader/native-tls",
]
native-tls-alpn = [
    "rustypipe/native-tls-alpn",
    "rustypipe-downloader/native-tls-alpn",
]
native-tls-vendored = [
    "rustypipe/native-tls-vendored",
    "rustypipe-downloader/native-tls-vendored",
]
rustls-tls-webpki-roots = [
    "rustypipe/rustls-tls-webpki-roots",
    "rustypipe-downloader/rustls-tls-webpki-roots",
]
rustls-tls-native-roots = [
    "rustypipe/rustls-tls-native-roots",
    "rustypipe-downloader/rustls-tls-native-roots",
]

[dependencies]
rustypipe = { workspace = true, features = ["rss", "userdata", "clap"] }
rustypipe-downloader.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures-util.workspace = true
serde.workspace = true
flexon.workspace = true
quick-xml.workspace = true
time = { workspace = true, optional = true }
time-tz = { version = "2.0.0", optional = true }
# Only used by the sabr_capture debug binary, but cheap to compile.
chromey = { workspace = true, optional = true }
base64 = "0.22"

indicatif.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_yaml.workspace = true
dirs.workspace = true

anstream = "0.6.15"
owo-colors = "4.0.0"
const_format = "0.2.33"

[[bin]]
name = "rustypipe"
path = "src/main.rs"

[[bin]]
name = "sabr_capture"
path = "src/bin/sabr_capture.rs"
required-features = ["chromey-po-token"]
