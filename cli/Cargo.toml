[package]
name = "rustypipe-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
rustypipe = { path = "../" }
rustypipe-downloader = { path = "../downloader" }
reqwest = { version = "0.11.11", default_features = false }
tokio = { version = "1.20.0", features = ["macros", "rt-multi-thread"] }
indicatif = "0.17.0"
futures = "0.3.21"
anyhow = "1.0"
clap = { version = "4.0.29", features = ["derive"] }
env_logger = "0.10.0"
serde = "1.0"
serde_json = "1.0.82"
serde_yaml = "0.9.19"
